name: FoodRescue PHP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check PHP syntax
        run: |
          find . -type f -name "*.php" \
            -not -path "./vendor/*" -print0 |
            xargs -0 -n1 php -l

